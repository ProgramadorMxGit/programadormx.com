<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>document.documentElement.classList.replace('no-js', 'js')</script>
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}">
  <meta name="theme-color" content="#0a0b0d">
  <link rel="canonical" href="{{ page.url }}">
  {{#if page.noindex}}<meta name="robots" content="noindex,follow">{{/if}}
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_MX">
  <meta property="og:site_name" content="{{ site.name }}">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:url" content="{{ page.url }}">
  <meta property="og:image" content="{{ site.url }}{{ page.og_image }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ page.og_image_alt }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ site.url }}{{ page.og_image }}">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32">
  <link rel="icon" href="/assets/favicon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ asset "site.css" }}">
  <!-- La entrada del hero espera a las fuentes (máx. 1.5 s): así el titular entra una sola vez con
       Bricolage y no cambia de letra a mitad de la animación. Marca html.fonts-ok y avisa con pmx:fonts. -->
  <script>(function(d){var r=d.documentElement,h=0;r.classList.replace('no-js','js');function ok(){if(h)return;h=1;r.classList.add('fonts-ok');d.dispatchEvent(new Event('pmx:fonts'))}if(!d.fonts||!d.fonts.load){ok();return}Promise.all(['500 1em "Bricolage Grotesque"','400 1em "IBM Plex Sans"','400 1em "IBM Plex Mono"'].map(function(f){return d.fonts.load(f)})).then(ok,ok);setTimeout(ok,1500)})(document)</script>
</head>
